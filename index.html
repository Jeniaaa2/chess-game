<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Шахматы от Jenia</title>
<script src="https://cloudflare.com"></script>
<style>
  body { background: #121212; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 15px; touch-action: manipulation; }
  h2 { margin: 5px 0 15px; color: #00e676; font-size: 22px; text-align: center; }
  #board { display: grid; grid-template-columns: repeat(8, 11.5vw); grid-template-rows: repeat(8, 11.5vw); max-width: 440px; max-height: 440px; border: 3px solid #444; box-shadow: 0 8px 25px rgba(0,0,0,0.6); }
  .sq { display: flex; justify-content: center; align-items: center; font-size: 9vw; cursor: pointer; user-select: none; }
  @media (min-width: 460px) { .sq { font-size: 42px; } }
  .light { background: #eeeed2; color: #000; }
  .dark { background: #769656; color: #000; }
  .selected { background: #f6f669 !important; }
  .controls { margin-top: 20px; display: flex; gap: 15px; }
  button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; background: #00e676; color: #000; font-weight: bold; cursor: pointer; }
  #status { margin-top: 15px; font-size: 16px; color: #ccc; font-weight: bold; }
</style>
</head>
<body>
  <h2>Шахматы от Jenia</h2>
  <div id="board"></div>
  <div id="status">Ваш ход (Белые)</div>
  <div class="controls">
    <button onclick="resetGame()">Новая игра</button>
  </div>

<script>
const game = new Chess();
const pieces = {'p':'♟','n':'♞','b':'♝','r':'♜','q':'♛','k':'♚','P':'♙','N':'♘','B':'♗','R':'♖','Q':'♕','K':'♔'};
const weights = {p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000};
let selected = null;

function evaluate(b) {
  let total = 0;
  const board = b.board();
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const p = board[r][c];
      if (p) total += (p.color === 'w' ? 1 : -1) * weights[p.type];
    }
  }
  return total;
}

function getBestMove() {
  const moves = game.moves();
  if (moves.length === 0) return null;
  let bestMove = moves[0];
  let bestVal = 99999;
  for (let m of moves) {
    game.move(m);
    let val = evaluate(game);
    if (game.in_checkmate()) val = -99999;
    game.undo();
    if (val < bestVal || (val === bestVal && Math.random() > 0.5)) {
      bestVal = val;
      bestMove = m;
    }
  }
  return bestMove;
}

function draw() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  const grid = game.board();
  const files = ['a','b','c','d','e','f','g','h'];
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const sq = files[f] + (8 - r);
      const div = document.createElement('div');
      div.className = 'sq ' + ((r + f) % 2 === 0 ? 'light' : 'dark');
      if (selected === sq) div.classList.add('selected');
      const p = grid[r][f];
      div.textContent = p ? pieces[p.color === 'w' ? p.type.toUpperCase() : p.type] : '';
      div.onclick = () => onClick(sq, p);
      b.appendChild(div);
    }
  }
}

function onClick(sq, p) {
  if (game.game_over()) return;
  if (!selected) {
    if (p && p.color === 'w') { selected = sq; draw(); }
  } else {
    if (selected === sq) { selected = null; draw(); return; }
    const move = game.move({ from: selected, to: sq, promotion: 'q' });
    selected = null;
    if (move) {
      draw();
      if (game.game_over()) { updateStatus(); return; }
      document.getElementById('status').textContent = 'Думаю...';
      setTimeout(() => {
        const ai = getBestMove();
        if (ai) game.move(ai);
        draw();
        updateStatus();
      }, 250);
    } else {
      draw();
    }
  }
}

function updateStatus() {
  if (game.in_checkmate()) document.getElementById('status').textContent = 'Мат! Игра окончена.';
  else if (game.in_draw()) document.getElementById('status').textContent = 'Ничья!';
  else document.getElementById('status').textContent = game.in_check() ? 'Шах! Ваш ход' : 'Ваш ход (Белые)';
}

function resetGame() {
  game.reset();
  selected = null;
  document.getElementById('status').textContent = 'Ваш ход (Белые)';
  draw();
}

resetGame();
</script>
</body>
</html>
