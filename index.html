<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ISS LIVE TRACKER // JENIA ORBITAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050810;color:#e2e8f0;font-family:monospace;padding:12px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.w{width:100%;max-width:500px;background:#0b111e;border:1px solid #1e293b;border-radius:8px;padding:14px;box-shadow:0 0 25px rgba(0,0,0,0.6)}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;padding-bottom:10px;margin-bottom:12px}
h1{font-size:15px;color:#38bdf8}
.live{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid #10b981;padding:3px 8px;border-radius:4px;font-size:10px;font-weight:bold}
canvas{width:100%;height:190px;background:#03060c;border:1px solid #1e293b;border-radius:6px;display:block;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.box{background:#0f172a;border:1px solid #1e293b;padding:9px;border-radius:6px}
.lbl{font-size:10px;color:#94a3b8;margin-bottom:3px;text-transform:uppercase}
.val{font-size:14px;font-weight:bold;color:#f8fafc}
.hi{color:#38bdf8}
.bar{background:#0f172a;border:1px solid #1e293b;padding:10px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.btns{display:flex;gap:8px}
button{flex:1;padding:12px 6px;border:none;border-radius:6px;font-family:monospace;font-weight:bold;font-size:12px;cursor:pointer;background:#0284c7;color:#fff}
button:active{transform:scale(0.98)}
button.s2{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
</style>
</head>
<body>
<div class="w">
  <header><h1>[ ISS TELEMETRY // JENIA ]</h1><span class="live" id="st">LIVE API</span></header>
  <canvas id="map"></canvas>
  <div class="grid">
    <div class="box"><div class="lbl">Широта / Долгота</div><div class="val hi" id="crd">Запрос...</div></div>
    <div class="box"><div class="lbl">Высота орбиты</div><div class="val" id="alt">...</div></div>
    <div class="box"><div class="lbl">Скорость МКС</div><div class="val" id="spd">...</div></div>
    <div class="box"><div class="lbl">Освещённость</div><div class="val" id="vis">...</div></div>
  </div>
  <div class="bar">
    <span id="locLabel">До МКС от Гомеля:</span>
    <b class="hi" id="dist">Расчёт...</b>
  </div>
  <div class="btns">
    <button onclick="myGeo()">МОЯ ГЕОПОЗИЦИЯ</button>
    <button class="s2" onclick="shareLink()">ОТПРАВИТЬ В ЧАТ</button>
  </div>
</div>
<script>
let uLat=52.4345,uLon=30.9754,trail=[];
const cvs=document.getElementById('map'),ctx=cvs.getContext('2d');

function calcDist(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function drawMap(lat,lon){
  const w=cvs.width=cvs.offsetWidth,h=cvs.height=190;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#131c31';ctx.lineWidth=1;
  for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(w*i/6,0);ctx.lineTo(w*i/6,h);ctx.stroke();}
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke();}
  ctx.strokeStyle='#1e3a5f';ctx.beginPath();ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();

  const ux=(uLon+180)/360*w,uy=(90-uLat)/180*h;
  ctx.fillStyle='#10b981';ctx.beginPath();ctx.arc(ux,uy,3.5,0,Math.PI*2);ctx.fill();

  trail.push({x:(lon+180)/360*w,y:(90-lat)/180*h});
  if(trail.length>40)trail.shift();
  ctx.strokeStyle='rgba(56,189,248,0.5)';ctx.lineWidth=2;ctx.beginPath();
  trail.forEach((p,i)=>{if(i===0)ctx.moveTo(p.x,p.y);else if(Math.abs(p.x-trail.at(i-1).x)<w/2)ctx.lineTo(p.x,p.y);else ctx.moveTo(p.x,p.y);});
  ctx.stroke();

  const sx=(lon+180)/360*w,sy=(90-lat)/180*h;
  ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.beginPath();ctx.arc(sx,sy,11,0,Math.PI*2);ctx.stroke();
}

async function fetchISS(){
  try{
    const res=await fetch('https://wheretheiss.at');
    const d=await res.json();
    const lat=d.latitude,lon=d.longitude;
    document.getElementById('crd').textContent=`${lat.toFixed(2)}°, ${lon.toFixed(2)}°`;
    document.getElementById('alt').textContent=`${d.altitude.toFixed(1)} км`;
    document.getElementById('spd').textContent=`${Math.round(d.velocity)} км/ч`;
    document.getElementById('vis').textContent=d.visibility==='daylight'?'Дневная зона':'Тень Земли';
    document.getElementById('dist').textContent=calcDist(uLat,uLon,lat,lon).toLocaleString('ru-RU')+' км';
    document.getElementById('st').textContent='ONLINE';
    drawMap(lat,lon);
  }catch(e){
    document.getElementById('st').textContent='API BLOCKED';
  }
}

function myGeo(){
  if(!navigator.geolocation){alert('Геолокация не поддерживается');return;}
  document.getElementById('locLabel').textContent='Поиск координат...';
  navigator.geolocation.getCurrentPosition(pos=>{
    uLat=pos.coords.latitude;uLon=pos.coords.longitude;
    document.getElementById('locLabel').textContent='До МКС от вас:';
    fetchISS();
  },()=>{alert('Доступ к GPS запрещён браузером');document.getElementById('locLabel').textContent='До МКС от Гомеля:';});
}

function shareLink(){
  const u=location.origin+location.pathname+'?t='+Date.now();
  if(navigator.share)navigator.share({title:'ISS Live Tracker',url:u});
  else{navigator.clipboard.writeText(u);alert('Ссылка на радар МКС скопирована!');}
}

fetchISS();
setInterval(fetchISS,3000);
</script>
</body>
</html>
