DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MATRIX OS // TERMINAL ACCESS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#00ff41;font-family:monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;user-select:none}
canvas{position:fixed;inset:0;z-index:0;opacity:0.45}
.top{position:relative;z-index:1;padding:10px 14px;background:rgba(0,15,0,0.85);border-bottom:1px solid #00ff41;display:flex;justify-content:space-between;font-size:13px;font-weight:bold}
#term{position:relative;z-index:1;flex:1;padding:12px;overflow-y:auto;font-size:13px;line-height:1.4;text-shadow:0 0 5px #00ff41;word-break:break-all}
.btns{position:relative;z-index:1;padding:10px;background:rgba(0,10,0,0.9);border-top:1px solid #00ff41;display:flex;gap:8px;justify-content:center}
button{flex:1;padding:12px 6px;background:#00290b;color:#00ff41;border:1px solid #00ff41;font-family:monospace;font-size:12px;font-weight:bold;cursor:pointer}
button:active{background:#00ff41;color:#000}
button.red{border-color:#ff2a2a;color:#ff2a2a;background:#290000}
button.red:active{background:#ff2a2a;color:#000}
#popup{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.box{border:3px solid #00ff41;padding:25px 20px;background:#001405;box-shadow:0 0 35px #00ff41;max-width:340px;width:100%}
.box.err{border-color:#ff2a2a;background:#1a0000;box-shadow:0 0 35px #ff2a2a;color:#ff2a2a}
.box h1{font-size:24px;margin-bottom:10px;letter-spacing:2px}
.box p{font-size:14px;margin-bottom:18px}
</style>
</head>
<body onclick="typeChunk()">
<canvas id="m"></canvas>
<div class="top">
  <span>[ NODE: JENIA-MAINFRAME ]</span>
  <span id="pct">BYPASS: 0%</span>
</div>
<div id="term">ИНИЦИАЛИЗАЦИЯ ПРОТОКОЛА NEO...<br>НАЖИМАЙТЕ НА ЭКРАН ДЛЯ ВВОДА КОДА ВЗЛОМА...<br><br></div>
<div class="btns" onclick="event.stopPropagation()">
  <button onclick="autoHack()">АВТОВЗЛОМ</button>
  <button onclick="showPop(true)">ДОСТУП [OK]</button>
  <button class="red" onclick="showPop(false)">ТРЕВОГА</button>
</div>
<div id="popup" onclick="this.style.display='none'">
  <div class="box" id="pbox">
    <h1 id="ptitle">ACCESS GRANTED</h1>
    <p id="pdesc">ПОДКЛЮЧЕНИЕ К ЦЕНТРАЛЬНОМУ СЕРВЕРУ ВЫПОЛНЕНО. УРОВЕНЬ ДОПУСКА: ADMIN (JENIA).</p>
    <button onclick="document.getElementById('popup').style.display='none'">ЗАКРЫТЬ ОКНО</button>
  </div>
</div>
<script>
const cvs=document.getElementById('m'),ctx=cvs.getContext('2d');
const ch='アイウエオカキクケコサシスセソタチツテト0123456789Z';
let dr=[];
function rm(){cvs.width=innerWidth;cvs.height=innerHeight;dr=Array(Math.floor(cvs.width/26)).fill(0).map(()=>Math.random()*-30)}
onresize=rm;rm();
setInterval(()=>{
  ctx.fillStyle='rgba(0,0,0,0.14)';ctx.fillRect(0,0,cvs.width,cvs.height);
  ctx.font='18px monospace';
  for(let i=0;i<dr.length;i++){
    ctx.fillStyle=Math.random()>0.9?'#fff':'#00ff41';
    ctx.fillText(ch.charAt(Math.floor(Math.random()*ch.length)),i*26,dr[i]*26);
    if(dr[i]*26>cvs.height&&Math.random()>0.96)dr[i]=0;else dr[i]++;
  }
},85);

const lines=[
  "ssh root@198.51.100.42 -p 443 --force-ssl",
  "Bypassing SHA-512 firewall encryption... [OK]",
  "Injecting kernel payload 0x8F9A2C4E into memory...",
  "Scanning open ports: 22, 80, 443, 8080, 31337...",
  "Decrypted RSA-4096 key: 9A:4F:11:E8:0C:77:B2:D5",
  "Downloading classified_archive_2026.tar.gz [48.2 GB]...",
  "Routing connection via proxy: Minsk -> Tokyo -> Zurich...",
  "WARNING: Trace program detected! Deploying stealth mask...",
  "Overriding biometric lock... User: JENIA_ADMIN",
  "Executing SQL dump: SELECT * FROM global_satellites;"
];
let progress=0,timer=null;

function typeChunk(){
  const t=document.getElementById('term');
  const rnd=lines[Math.floor(Math.random()*lines.length)];
  const hex=Math.random().toString(16).substring(2,10).toUpperCase();
  t.innerHTML+=`> [${hex}] ${rnd}<br>`;
  t.scrollTop=t.scrollHeight;
  if(progress<100){
    progress+=Math.floor(Math.random()*7)+2;
    if(progress>=100){progress=100;showPop(true)}
    document.getElementById('pct').textContent=`BYPASS: ${progress}%`;
  }
}

function autoHack(){
  if(timer)clearInterval(timer);
  progress=0;
  document.getElementById('term').innerHTML="ЗАПУСК АВТОМАТИЧЕСКОГО ПОДБОРА КЛЮЧЕЙ...<br>";
  timer=setInterval(()=>{
    typeChunk();
    if(progress>=100){clearInterval(timer);timer=null}
  },160);
}

function showPop(ok){
  if(timer){clearInterval(timer);timer=null}
  const pop=document.getElementById('popup'),box=document.getElementById('pbox');
  const title=document.getElementById('ptitle'),desc=document.getElementById('pdesc');
  if(ok){
    box.className='box';
    title.textContent='ACCESS GRANTED';
    desc.textContent='ВЗЛОМ ЗАВЕРШЁН НА 100%. ВСЕ СИСТЕМЫ ПОД КОНТРОЛЕМ JENIA.';
  }else{
    box.className='box err';
    title.textContent='SYSTEM ALERT!';
    desc.textContent='ОБНАРУЖЕНО ВТОРЖЕНИЕ! СРАБОТАЛА ЗАЩИТА ПЕРИМЕТРА. СРОЧНО СМЕНИТЕ IP!';
  }
  pop.style.display='flex';
}
</script>
</body>
</html>
