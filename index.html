<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Шахматы от Jenia — Stockfish Matrix</title>
<script src="https://cloudflare.com"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  background: #000;
  color: #fff;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 8px;
  touch-action: none;
  user-select: none;
  overflow: hidden;
}
#matrix {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  z-index: 0;
}
.ui {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
h2 {
  margin-bottom: 10px;
  color: #ffd700;
  font-size: 21px;
  text-align: center;
  text-shadow: 0 0 10px #000, 0 0 15px #00e676;
}
#wrap {
  padding: 5px;
  background: linear-gradient(145deg, #ffd700, #8a6614);
  border-radius: 10px;
  box-shadow: 0 0 25px rgba(0, 230, 118, 0.45);
}
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 90vw;
  height: 90vw;
  max-width: 420px;
  max-height: 420px;
  border-radius: 4px;
  overflow: hidden;
}
.sq {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 9vw;
  cursor: pointer;
}
@media (min-width: 460px) {
  .sq { font-size: 42px; }
}
.l { background: #f3e5ab; }
.d { background: #165b49; }
.sel { background: #fbc02d !important; }
.last { box-shadow: inset 0 0 0 3px #00e676; }
.hint::after {
  content: "";
  width: 26%;
  height: 26%;
  background: rgba(255, 215, 0, 0.85);
  border-radius: 50%;
}
.w {
  color: #fff;
  text-shadow: 0 2px 3px #000, 0 0 8px #00e676;
  pointer-events: none;
}
.b {
  color: #111;
  text-shadow: 0 0 2px #ffd700, 0 2px 3px #000;
  pointer-events: none;
}
#ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  font-size: 46px;
  transform: translate(-50%, -50%);
  display: none;
}
#st {
  margin-top: 12px;
  padding: 4px 12px;
  background: rgba(0, 0, 0, 0.75);
  border: 1px solid #00e676;
  border-radius: 6px;
  font-size: 15px;
  color: #f3e5ab;
  font-weight: bold;
  text-align: center;
}
.btns {
  margin-top: 10px;
  display: flex;
  gap: 10px;
}
button {
  padding: 11px 18px;
  font-size: 15px;
  border: none;
  border-radius: 8px;
  background: #ffd700;
  color: #090d16;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 12px rgba(0, 0, 0, 0.8);
}
button.alt {
  background: #00e676;
  color: #05140c;
}
</style>
</head>
<body>
  <canvas id="matrix"></canvas>
  <div class="ui">
    <h2>♔ Шахматы от Jenia (Stockfish) ♚</h2>
    <div id="wrap"><div id="board"></div></div>
    <div id="st">Загрузка Stockfish...</div>
    <div class="btns">
      <button onclick="startNew(playerColor)">Новая партия</button>
      <button class="alt" id="sideBtn" onclick="switchSide()">Играть за Чёрных</button>
    </div>
  </div>
  <div id="ghost"></div>

<script>
const cvs = document.getElementById('matrix');
const ctx = cvs.getContext('2d');
let cols = 0, drops = [];
const chars = '0123456789ABCDEF♔♕♖♗♘♙♚♛♜♝♞♟';

function resizeMatrix() {
  cvs.width = window.innerWidth;
  cvs.height = window.innerHeight;
  cols = Math.floor(cvs.width / 16);
  drops = [];
  for (let i = 0; i < cols; i++) drops[i] = Math.random() * -50;
}
window.addEventListener('resize', resizeMatrix);
resizeMatrix();

setInterval(function() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, cvs.width, cvs.height);
  ctx.fillStyle = '#00e676';
  ctx.font = '15px monospace';
  for (let i = 0; i < drops.length; i++) {
    const txt = chars.charAt(Math.floor(Math.random() * chars.length));
    ctx.fillText(txt, i * 16, drops[i] * 16);
    if (drops[i] * 16 > cvs.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}, 45);

const game = new Chess();
const P = {
  P:'♙', N:'♘', B:'♗', R:'♖', Q:'♕', K:'♔',
  p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚'
};
let sel = null, last = null, hints = [];
let sf = null, ready = false;
let playerColor = 'w';
let dragSq = null;

async function initEngine() {
  try {
    const url = 'https://cloudflare.com';
    const res = await fetch(url);
    const code = await res.text();
    const blob = new Blob([code], {type: 'application/javascript'});
    sf = new Worker(URL.createObjectURL(blob));
    sf.onmessage = function(e) {
      const line = e.data;
      if (line === 'uciok') {
        ready = true;
        startNew('w');
      } else if (line.startsWith('bestmove')) {
        const parts = line.split(' ');
        const moveStr = parts[1];
        if (moveStr && moveStr !== '(none)') {
          const from = moveStr.slice(0, 2);
          const to = moveStr.slice(2, 4);
          const prom = moveStr.length > 4 ? moveStr[4] : 'q';
          game.move({from: from, to: to, promotion: prom});
          last = {from: from, to: to};
          draw();
          updateStatus();
        }
      }
    };
    sf.postMessage('uci');
  } catch (err) {
    document.getElementById('st').textContent = 'Ошибка загрузки Stockfish';
  }
}

function askStockfish() {
  if (!ready || game.game_over()) return;
  document.getElementById('st').textContent = 'Stockfish думает...';
  sf.postMessage('position fen ' + game.fen());
  sf.postMessage('go movetime 1000');
}

function startNew(color) {
  playerColor = color;
  game.reset();
  sel = null;
  last = null;
  hints = [];
  dragSq = null;
  const btn = document.getElementById('sideBtn');
  btn.textContent = color === 'w' ? 'Играть за Чёрных' : 'Играть за Белых';
  draw();
  if (!ready) return;
  if (playerColor === 'b') {
    askStockfish();
  } else {
    document.getElementById('st').textContent = 'Ваш ход (Белые)';
  }
}

function switchSide() {
  const next = playerColor === 'w' ? 'b' : 'w';
  startNew(next);
}

function draw() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  const b = game.board();
  const files = ['a','b','c','d','e','f','g','h'];
  for (let i = 0; i < 8; i++) {
    for (let j = 0; j < 8; j++) {
      const r = playerColor === 'w' ? i : 7 - i;
      const c = playerColor === 'w' ? j : 7 - j;
      const sqName = files[c] + (8 - r);
      const d = document.createElement('div');
      d.className = 'sq ' + ((r + c) % 2 === 0 ? 'l' : 'd');
      d.dataset.sq = sqName;

      if (sel === sqName) d.classList.add('sel');
      if (last && (last.from === sqName || last.to === sqName)) d.classList.add('last');
      for (let h = 0; h < hints.length; h++) {
        if (hints[h] === sqName) d.classList.add('hint');
      }

      const p = b[r][c];
      if (p && dragSq !== sqName) {
        const s = document.createElement('span');
        const key = p.color === 'w' ? p.type.toUpperCase() : p.type;
        s.className = p.color === 'w' ? 'w' : 'b';
        s.textContent = P[key];
        d.appendChild(s);
      }

      d.addEventListener('pointerdown', function(e) { onDown(e, sqName, p); });
      el.appendChild(d);
    }
  }
}

function getHintsFor(sq) {
  const list = game.moves({square: sq, verbose: true});
  const res = [];
  for (let i = 0; i < list.length; i++) res.push(list[i].to);
  return res;
}

function onDown(e, sq, p) {
  if (!ready || game.turn() !== playerColor || game.game_over()) return;

  if (sel && hints.indexOf(sq) !== -1) {
    makePlayerMove(sel, sq);
    return;
  }

  if (p && p.color === playerColor) {
    sel = sq;
    hints = getHintsFor(sq);
    dragSq = sq;
    const ghost = document.getElementById('ghost');
    const key = p.color === 'w' ? p.type.toUpperCase() : p.type;
    ghost.textContent = P[key];
    ghost.className = p.color === 'w' ? 'w' : 'b';
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    ghost.style.display = 'block';
    draw();
  } else {
    sel = null;
    hints = [];
    draw();
  }
}

window.addEventListener('pointermove', function(e) {
  if (!dragSq) return;
  const ghost = document.getElementById('ghost');
  ghost.style.left = e.clientX + 'px';
  ghost.style.top = e.clientY + 'px';
});

window.addEventListener('pointerup', function(e) {
  if (!dragSq) return;
  const ghost = document.getElementById('ghost');
  ghost.style.display = 'none';
  const fromSq = dragSq;
  dragSq = null;

  const tgt = document.elementFromPoint(e.clientX, e.clientY);
  if (tgt && tgt.dataset && tgt.dataset.sq) {
    const toSq = tgt.dataset.sq;
    if (toSq !== fromSq && hints.indexOf(toSq) !== -1) {
      makePlayerMove(fromSq, toSq);
      return;
    }
  }
  draw();
});

function makePlayerMove(fromSq, toSq) {
  const move = game.move({from: fromSq, to: toSq, promotion: 'q'});
  sel = null;
  hints = [];
  if (move) {
    last = {from: move.from, to: move.to};
    draw();
    if (game.game_over()) {
      updateStatus();
    } else {
      askStockfish();
    }
  } else {
    draw();
  }
}

function updateStatus() {
  const sideText = playerColor === 'w' ? 'Белые' : 'Чёрные';
  if (game.in_checkmate()) {
    document.getElementById('st').textContent = 'Мат! Партия окончена.';
  } else if (game.in_draw()) {
    document.getElementById('st').textContent = 'Ничья!';
  } else if (game.in_check()) {
    document.getElementById('st').textContent = 'Шах! Ваш ход (' + sideText + ')';
  } else {
    document.getElementById('st').textContent = 'Ваш ход (' + sideText + ')';
  }
}

draw();
initEngine();
</script>
</body>
</html>
