<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Шахматы от Jenia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;touch-action:none;user-select:none}
#m{position:fixed;inset:0;z-index:0}
.u{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
h2{margin-bottom:8px;color:#ffd700;font-size:20px;text-shadow:0 0 10px #00e676}
#w{padding:5px;background:linear-gradient(145deg,#ffd700,#8a6614);border-radius:10px;box-shadow:0 0 25px rgba(0,230,118,.5)}
#b{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:90vw;height:90vw;max-width:420px;max-height:420px;border-radius:4px;overflow:hidden}
.q{display:flex;justify-content:center;align-items:center;font-size:9vw;cursor:pointer}
@media(min-width:460px){.q{font-size:42px}}
.l{background:#f3e5ab}.d{background:#165b49}.s{background:#fbc02d!important}.o{box-shadow:inset 0 0 0 3px #00e676}
.cw{color:#fff;text-shadow:0 2px 3px #000,0 0 8px #00e676}.cb{color:#111;text-shadow:0 0 2px #ffd700,0 2px 3px #000}
#st{margin-top:10px;padding:4px 12px;background:rgba(0,0,0,.85);border:1px solid #00e676;border-radius:6px;font-size:15px;color:#f3e5ab;font-weight:700}
.bs{margin-top:10px;display:flex;gap:10px}
button{padding:10px 16px;font-size:15px;border:none;border-radius:8px;background:#ffd700;color:#090d16;font-weight:700}
button.a{background:#00e676}
</style>
</head>
<body>
<canvas id="m"></canvas>
<div class="u">
<h2>♔ Шахматы от Jenia (Stockfish) ♚</h2>
<div id="w"><div id="b"></div></div>
<div id="st">Загрузка Stockfish...</div>
<div class="bs">
<button onclick="init(col)">Новая партия</button>
<button class="a" id="sb" onclick="init(col==='w'?'b':'w')">Играть за Чёрных</button>
</div>
</div>
<script>
const c=document.getElementById('m'),x=c.getContext('2d'),ch='0123456789ABCDEF♔♕♖♗♘♙♚♛♜♝♞♟';
let dr=[];function rm(){c.width=innerWidth;c.height=innerHeight;dr=Array(Math.floor(c.width/16)).fill(0).map(()=>Math.random()*-50)}
onresize=rm;rm();
setInterval(()=>{x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00e676';x.font='15px monospace';dr.forEach((y,i)=>{x.fillText(ch.charAt(Math.random()*ch.length),i*16,y*16);dr[i]=y*16>c.height&&Math.random()>.975?0:y+1})},45);
const P={P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'},V={p:100,n:320,b:330,r:500,q:900,k:20000};
let B=[],sel=null,lst=null,col='w',trn='w',sf=null,ok=false;
const isW=p=>p&&p===p.toUpperCase(),isB=p=>p&&p===p.toLowerCase();
function moves(r,c){
const p=B[r][c];if(!p)return[];const res=[],w=isW(p),t=p.toLowerCase();
const add=(nr,nc)=>{if(nr<0||nr>7||nc<0||nc>7)return false;if(!B[nr][nc]){res.push({sr:r,sc:c,r:nr,c:nc});return true}if(w!==isW(B[nr][nc]))res.push({sr:r,sc:c,r:nr,c:nc});return false};
const ray=(dr,dc)=>{let nr=r+dr,nc=c+dc;while(add(nr,nc)){nr+=dr;nc+=dc}};
if(t==='p'){const d=w?-1:1,s=w?6:1;if(r+d>=0&&r+d<=7&&!B[r+d][c]){res.push({sr:r,sc:c,r:r+d,c:c});if(r===s&&!B[r+2*d][c])res.push({sr:r,sc:c,r:r+2*d,c:c})}[-1,1].forEach(dc=>{if(r+d>=0&&r+d<=7&&c+dc>=0&&c+dc<=7&&B[r+d][c+dc]&&w!==isW(B[r+d][c+dc]))res.push({sr:r,sc:c,r:r+d,c:c+dc})})}
else if(t==='n'){add(r-2,c-1);add(r-2,c+1);add(r-1,c-2);add(r-1,c+2);add(r+1,c-2);add(r+1,c+2);add(r+2,c-1);add(r+2,c+1)}
else if(t==='k'){for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++)if(i||j)add(r+i,c+j)}
else{if(t==='r'||t==='q'){ray(-1,0);ray(1,0);ray(0,-1);ray(0,1)}if(t==='b'||t==='q'){ray(-1,-1);ray(-1,1);ray(1,-1);ray(1,1)}}
return res}
function fen(){return B.map(rw=>{let s='',e=0;rw.forEach(v=>{if(!v)e++;else{if(e){s+=e;e=0}s+=v}});return e?s+e:s}).join('/')+' '+trn+' - - 0 1'}
function draw(){
const el=document.getElementById('b');el.innerHTML='';
for(let i=0;i<8;i++)for(let j=0;j<8;j++){
const r=col==='w'?i:7-i,c=col==='w'?j:7-j,d=document.createElement('div');
d.className='q '+((r+c)%2===0?'l':'d');
if(sel&&sel.r===r&&sel.c===c)d.classList.add('s');
if(lst&&((lst.sr===r&&lst.sc===c)||(lst.r===r&&lst.c===c)))d.classList.add('o');
const p=B[r][c];if(p){const s=document.createElement('span');s.className=isW(p)?'cw':'cb';s.textContent=P[p];d.appendChild(s)}
d.onclick=()=>tap(r,c);el.appendChild(d)}}
function tap(r,c){
if(trn!==col)return;const p=B[r][c],mine=col==='w'?isW(p):isB(p);
if(sel){const f=moves(sel.r,sel.c).find(m=>m.r===r&&m.c===c);if(f){go(f);return}}
sel=mine?{r,c}:null;draw()}
function go(m){
let p=B[m.sr][m.sc],cap=B[m.r][m.c];if(p==='P'&&m.r===0)p='Q';if(p==='p'&&m.r===7)p='q';
B[m.r][m.c]=p;B[m.sr][m.sc]='';lst=m;sel=null;trn=trn==='w'?'b':'w';draw();
if(cap==='K'||cap==='k'){document.getElementById('st').textContent='Король взят! Партия окончена.';return}
if(trn!==col){document.getElementById('st').textContent=ok?'Stockfish думает...':'Соперник думает...';if(ok){sf.postMessage('position fen '+fen());sf.postMessage('go movetime 900')}else setTimeout(bot,300)}
else document.getElementById('st').textContent='Ваш ход ('+(col==='w'?'Белые':'Чёрные')+')'}
function bot(){
let a=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=B[r][c];if(p&&(trn==='w'?isW(p):isB(p)))moves(r,c).forEach(m=>a.push({m,s:(B[m.r][m.c]?V[B[m.r][m.c].toLowerCase()]:0)+Math.random()*15}))}
if(!a.length){document.getElementById('st').textContent='Партия окончена!';return}
a.sort((x,y)=>y.s-x.s);go(a.at(0).m)}
function init(cl){
col=cl;B=[['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']];
sel=lst=null;trn='w';document.getElementById('sb').textContent=cl==='w'?'Играть за Чёрных':'Играть за Белых';draw();
if(col==='b'){document.getElementById('st').textContent=ok?'Stockfish думает...':'Соперник думает...';if(ok){sf.postMessage('position fen '+fen());sf.postMessage('go movetime 900')}else setTimeout(bot,400)}
else document.getElementById('st').textContent='Ваш ход (Белые)'}
(async()=>{try{const r=await fetch('https://cloudflare.com');sf=new Worker(URL.createObjectURL(new Blob([await r.text()],{type:'application/javascript'})));
sf.onmessage=e=>{const l=e.data;if(l==='uciok'){ok=true;if(trn!==col){sf.postMessage('position fen '+fen());sf.postMessage('go movetime 900')}else document.getElementById('st').textContent='Ваш ход ('+(col==='w'?'Белые':'Чёрные')+')'}
else if(l.startsWith('bestmove')){const m=l.split(' ').at(1);if(m&&m!=='(none)'&&trn!==col)go({sr:8-m.charAt(1),sc:'abcdefgh'.indexOf(m.charAt(0)),r:8-m.charAt(3),c:'abcdefgh'.indexOf(m.charAt(2))})}};sf.postMessage('uci')}catch(e){document.getElementById('st').textContent='Ваш ход ('+(col==='w'?'Белые':'Чёрные')+')'}})();
init('w');
</script>
</body>
</html>
