<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>CYBER DODGE // JENIA ARCADE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#03070b;color:#fff;font-family:monospace;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none}
canvas{display:block;background:radial-gradient(circle at center,#071921 0%,#020508 100%);box-shadow:0 0 30px rgba(0,255,170,0.2);border:1px solid #00ffaa}
#hud{position:fixed;top:12px;width:92vw;max-width:420px;display:flex;justify-content:space-between;font-size:16px;font-weight:bold;color:#00ffaa;text-shadow:0 0 8px #00ffaa;pointer-events:none;z-index:2}
#menu{position:fixed;inset:0;background:rgba(2,6,10,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
h1{font-size:26px;color:#00ffaa;text-shadow:0 0 15px #00ffaa;margin-bottom:8px;letter-spacing:2px}
p{font-size:14px;color:#94a3b8;margin-bottom:18px;max-width:300px;line-height:1.4}
.res{font-size:20px;color:#ffd700;font-weight:bold;margin-bottom:16px;display:none}
button{width:240px;padding:14px;margin-bottom:10px;border:none;border-radius:8px;font-family:monospace;font-size:16px;font-weight:bold;cursor:pointer;background:linear-gradient(90deg,#00c880,#00ffaa);color:#020a08;box-shadow:0 0 15px rgba(0,255,170,0.4)}
button:active{transform:scale(0.96)}
button.chal{background:linear-gradient(90deg,#f59e0b,#ffd700);color:#000;display:none}
</style>
</head>
<body>
  <div id="hud">
    <span>СЧЁТ: <b id="sc">0</b></span>
    <span>РЕКОРД: <b id="hi">0</b></span>
  </div>

  <canvas id="c"></canvas>

  <div id="menu">
    <h1 id="title">CYBER DODGE</h1>
    <p id="desc">Двигай пальцем по экрану, уворачивайся от красных барьеров и собирай золотые энергоблоки.</p>
    <div class="res" id="resBox">ТВОЙ СЧЁТ: 0</div>
    <button onclick="startGame()">ИГРАТЬ</button>
    <button class="chal" id="chalBtn" onclick="shareScore()">БРОСИТЬ ВЫЗОВ ДРУГУ</button>
  </div>

<script>
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W,H;
function resize(){W=cvs.width=Math.min(innerWidth,440);H=cvs.height=innerHeight;}
resize();window.onresize=resize;

let best=parseInt(localStorage.getItem('jenia_dodge_hi')||'0',10);
document.getElementById('hi').textContent=best;

let playing=false,score=0,speed=4,player={x:0,y:0,r:14},obs=[],gems=[],parts=[],frame=0;
let audioCtx=null;

function beep(freq,dur,type='sine'){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0.08,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function boom(x,y,col){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,v=Math.random()*4+1;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25,c:col});
  }
}

function startGame(){
  document.getElementById('menu').style.display='none';
  score=0;speed=4.2;obs=[];gems=[];parts=[];frame=0;
  player.x=W/2;player.y=H*0.8;
  playing=true;
  beep(520,0.15,'triangle');
  loop();
}

function movePlayer(clientX){
  if(!playing)return;
  const rect=cvs.getBoundingClientRect();
  let nx=clientX-rect.left;
  if(nx<player.r+6)nx=player.r+6;
  if(nx>W-player.r-6)nx=W-player.r-6;
  player.x=nx;
}
window.addEventListener('pointermove',e=>movePlayer(e.clientX));
window.addEventListener('pointerdown',e=>movePlayer(e.clientX));

function gameOver(){
  playing=false;
  if(navigator.vibrate)navigator.vibrate([100,50,150]);
  beep(140,0.4,'sawtooth');
  boom(player.x,player.y,'#ff2a55');
  if(score>best){
    best=score;
    localStorage.setItem('jenia_dodge_hi',best);
    document.getElementById('hi').textContent=best;
  }
  document.getElementById('title').textContent='СИСТЕМА СБИТА';
  document.getElementById('desc').textContent='Отличная реакция! Попробуй продержаться ещё дольше или отправь вызов в чат.';
  const rb=document.getElementById('resBox');
  rb.style.display='block';rb.textContent='НАБРАНО ОЧКОВ: '+score;
  document.getElementById('chalBtn').style.display='block';
  document.getElementById('menu').style.display='flex';
}

function shareScore(){
  const txt=`⚡ Я набрал ${score} очков в кибер-аркаде от Jenia! Сможешь побить мой рекорд? Жми: ${location.origin+location.pathname}`;
  if(navigator.share)navigator.share({title:'Cyber Dodge Jenia',text:txt,url:location.origin+location.pathname});
  else{navigator.clipboard.writeText(txt);document.getElementById('chalBtn').textContent='ВЫЗОВ СКОПИРОВАН В БУФЕР!';}
}

function loop(){
  if(!playing)return;
  ctx.clearRect(0,0,W,H);
  frame++;
  score++;
  if(frame%180===0)speed+=0.35;
  document.getElementById('sc').textContent=score;

  // Сетка фона
  ctx.strokeStyle='rgba(0,255,170,0.06)';
  ctx.lineWidth=1;
  const off=(frame*speed)%40;
  for(let y=off;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Генерация препятствий и бонусов
  if(frame%Math.max(18,Math.floor(42-speed*2))===0){
    const w=Math.random()*(W*0.42)+45;
    const x=Math.random()*(W-w);
    obs.push({x,y:-25,w,h:18});
  }
  if(frame%65===0){
    gems.push({x:Math.random()*(W-40)+20,y:-20,r:10});
  }

  // Препятствия
  ctx.fillStyle='#ff2a55';ctx.shadowBlur=12;ctx.shadowColor='#ff2a55';
  for(let i=obs.length-1;i>=0;i--){
    const o=obs.at(i);o.y+=speed;
    ctx.fillRect(o.x,o.y,o.w,o.h);
    if(player.x+player.r-3>o.x&&player.x-player.r+3<o.x+o.w&&player.y+player.r-3>o.y&&player.y-player.r+3<o.y+o.h){
      gameOver();return;
    }
    if(o.y>H+30)obs.splice(i,1);
  }

  // Бонусные кристаллы
  ctx.fillStyle='#ffd700';ctx.shadowColor='#ffd700';
  for(let i=gems.length-1;i>=0;i--){
    const g=gems.at(i);g.y+=speed*0.9;
    ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,Math.PI*2);ctx.fill();
    const dx=player.x-g.x,dy=player.y-g.y;
    if(Math.hypot(dx,dy)<player.r+g.r){
      score+=100;beep(880,0.1,'sine');boom(g.x,g.y,'#ffd700');
      gems.splice(i,1);continue;
    }
    if(g.y>H+30)gems.splice(i,1);
  }

  // Игрок
  ctx.fillStyle='#00ffaa';ctx.shadowBlur=18;ctx.shadowColor='#00ffaa';
  ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x,player.y,player.r*0.45,0,Math.PI*2);ctx.fill();

  // Частицы
  ctx.shadowBlur=0;
  for(let i=parts.length-1;i>=0;i--){
    const p=parts.at(i);p.x+=p.vx;p.y+=p.vy;p.life--;
    ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3);
    if(p.life<=0)parts.splice(i,1);
  }

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
