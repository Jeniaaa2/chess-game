<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Шахматы от Jenia</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d131f;
  color: #fff;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 8px;
  touch-action: manipulation;
  user-select: none;
}
h2 { margin-bottom: 10px; color: #ffd700; font-size: 22px; }
#wrap { padding: 5px; background: #d4af37; border-radius: 10px; }
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 90vw;
  height: 90vw;
  max-width: 420px;
  max-height: 420px;
  border-radius: 4px;
  overflow: hidden;
}
.sq {
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 34px;
  cursor: pointer;
}
.l { background: #f3e5ab; }
.d { background: #165b49; }
.sel { background: #fbc02d !important; }
.w { color: #fff; text-shadow: 0 2px 3px #000, 0 0 8px #00e676; }
.b { color: #111; text-shadow: 0 0 2px #ffd700, 0 2px 3px #000; }
#st { margin-top: 12px; font-size: 16px; color: #f3e5ab; font-weight: bold; }
button {
  margin-top: 12px;
  padding: 12px 24px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  background: #ffd700;
  color: #090d16;
  font-weight: bold;
}
</style>
</head>
<body>
  <h2>♔ Шахматы от Jenia ♚</h2>
  <div id="wrap"><div id="board"></div></div>
  <div id="st">Ваш ход (Белые)</div>
  <button onclick="reset()">Новая партия</button>
<script>
const P = {P:'♙',N:'♘',B:'♗',R:'♖',Q:'♕',K:'♔',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
const V = {p:10,n:30,b:30,r:50,q:90,k:900};
let B = [], sel = null, turn = 'w';

function reset() {
  B = [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['','','','','','','',''],
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']
  ];
  sel = null;
  turn = 'w';
  document.getElementById('st').textContent = 'Ваш ход (Белые)';
  draw();
}

function isW(p) { return p && p === p.toUpperCase(); }
function isB(p) { return p && p === p.toLowerCase(); }

function moves(r, c) {
  const p = B[r][c];
  if (!p) return [];
  const res = [], w = isW(p), t = p.toLowerCase();
  const add = (nr, nc) => {
    if (nr < 0 || nr > 7 || nc < 0 || nc > 7) return false;
    if (!B[nr][nc]) { res.push([nr, nc]); return true; }
    if (w !== isW(B[nr][nc])) res.push([nr, nc]);
    return false;
  };
  if (t === 'p') {
    const d = w ? -1 : 1, s = w ? 6 : 1;
    if (r+d >= 0 && r+d <= 7 && !B[r+d][c]) {
      res.push([r+d, c]);
      if (r === s && !B[r+2*d][c]) res.push([r+2*d, c]);
    }
    for (let dc of [-1, 1]) {
      if (r+d >= 0 && r+d <= 7 && c+dc >= 0 && c+dc <= 7 && B[r+d][c+dc] && w !== isW(B[r+d][c+dc])) {
        res.push([r+d, c+dc]);
      }
    }
  } else if (t === 'n') {
    [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(x => add(r+x[0], c+x[1]));
  } else if (t === 'k') {
    for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) if (dr||dc) add(r+dr, c+dc);
  } else {
    const dirs = [];
    if (t === 'r' || t === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    if (t === 'b' || t === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    dirs.forEach(x => { let nr = r+x[0], nc = c+x[1]; while (add(nr, nc)) { nr += x[0]; nc += x[1]; } });
  }
  return res;
}

function draw() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const d = document.createElement('div');
      d.className = 'sq ' + ((r + c) % 2 === 0 ? 'l' : 'd');
      if (sel && sel[0] === r && sel[1] === c) d.classList.add('sel');
      const p = B[r][c];
      if (p) {
        const s = document.createElement('span');
        s.className = isW(p) ? 'w' : 'b';
        s.textContent = P[p];
        d.appendChild(s);
      }
      d.onclick = () => tap(r, c);
      el.appendChild(d);
    }
  }
}

function tap(r, c) {
  if (turn !== 'w') return;
  const p = B[r][c];
  if (!sel) {
    if (isW(p)) { sel = [r, c]; draw(); }
  } else {
    const [sr, sc] = sel;
    if (sr === r && sc === c) { sel = null; draw(); return; }
    if (moves(sr, sc).some(m => m[0] === r && m[1] === c)) {
      move(sr, sc, r, c);
      sel = null;
      turn = 'b';
      draw();
      document.getElementById('st').textContent = 'Соперник думает...';
      setTimeout(ai, 250);
    } else if (isW(p)) {
      sel = [r, c]; draw();
    } else {
      sel = null; draw();
    }
  }
}

function move(sr, sc, r, c) {
  let p = B[sr][sc];
  if (p === 'P' && r === 0) p = 'Q';
  if (p === 'p' && r === 7) p = 'q';
  B[r][c] = p;
  B[sr][sc] = '';
}

function ai() {
  let all = [];
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      if (isB(B[r][c])) {
        moves(r, c).forEach(m => {
          const tgt = B[m[0]][m[1]];
          all.push({sr:r, sc:c, r:m[0], c:m[1], s:(tgt ? V[tgt.toLowerCase()] : 0) + Math.random()});
        });
      }
    }
  }
  if (!all.length) { document.getElementById('st').textContent = 'Партия окончена!'; return; }
  all.sort((a, b) => b.s - a.s);
  const m = all[0], cap = B[m.r][m.c];
  move(m.sr, m.sc, m.r, m.c);
  turn = 'w';
  draw();
  document.getElementById('st').textContent = cap === 'K' ? 'Король взят! Нажмите Новая партия.' : 'Ваш ход (Белые)';
}

reset();
</script>
</body>
</html>
