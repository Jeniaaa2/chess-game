<script>
let imgObj=null;
function showOut(txt,col){
  const o=document.getElementById('out');
  o.style.display='block';o.style.color=col||'#ffd700';o.textContent=txt;
}
function loadImg(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    const im=new Image();
    im.onload=()=>{imgObj=im;const p=document.getElementById('prev');p.src=im.src;p.style.display='block';showOut('Картинка загружена ('+im.width+'x'+im.height+'). Готово к работе.','#00ff41');};
    im.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function xorCrypt(str,key){
  if(!key)return str;
  let res='';
  for(let i=0;i<str.length;i++)res+=String.fromCharCode(str.charCodeAt(i)^key.charCodeAt(i%key.length));
  return res;
}
function hideText(){
  if(!imgObj){showOut('Сначала выбери картинку!','#f43f5e');return;}
  const raw=document.getElementById('msg').value;
  if(!raw){showOut('Впиши секретное сообщение!','#f43f5e');return;}
  const key=document.getElementById('pwd').value||'jenia';
  const enc='JVAULT:'+btoa(unescape(encodeURIComponent(xorCrypt(raw,key))))+'#END#';
  const c=document.createElement('canvas');
  c.width=imgObj.width;c.height=imgObj.height;
  const ctx=c.getContext('2d');ctx.drawImage(imgObj,0,0);
  const id=ctx.getImageData(0,0,c.width,c.height),d=id.data;
  if(enc.length*8>d.length/4*3){showOut('Текст слишком длинный для этого фото!','#f43f5e');return;}
  let bitIdx=0;
  for(let i=0;i<enc.length;i++){
    const code=enc.charCodeAt(i);
    for(let b=7;b>=0;b--){
      const bit=(code>>b)&1;
      const px=Math.floor(bitIdx/3)*4+(bitIdx%3);
      d.splice(px,1,(d.at(px)&254)|bit);
      bitIdx++;
    }
  }
  ctx.putImageData(id,0,0);
  const a=document.createElement('a');
  a.href=c.toDataURL('image/png');
  a.download='secret_photo_'+Date.now()+'.png';
  a.click();
  showOut('ГОТОВО! Секрет зашит в пиксели. Скачан файл secret_photo.png — отправляй его в чат КАК ФАЙЛ (без сжатия)!','#00ff41');
}
function readText(){
  if(!imgObj){showOut('Сначала выбери картинку с секретом!','#f43f5e');return;}
  const key=document.getElementById('pwd').value||'jenia';
  const c=document.createElement('canvas');
  c.width=imgObj.width;c.height=imgObj.height;
  const ctx=c.getContext('2d');ctx.drawImage(imgObj,0,0);
  const d=ctx.getImageData(0,0,c.width,c.height).data;
  let chars='',cur=0,bits=0,maxPx=Math.min(d.length,120000);
  for(let i=0;i<maxPx;i++){
    if(i%4===3)continue;
    cur=(cur<<1)|(d.at(i)&1);bits++;
    if(bits===8){
      chars+=String.fromCharCode(cur);
      if(chars.endsWith('#END#'))break;
      cur=0;bits=0;
    }
  }
  if(!chars.startsWith('JVAULT:')||!chars.endsWith('#END#')){
    showOut('В этом фото нет скрытого послания (или оно сжато мессенджером).','#f43f5e');return;
  }
  try{
    const b64=chars.slice(7,-5);
    const dec=xorCrypt(decodeURIComponent(escape(atob(b64))),key);
    showOut('РАСШИФРОВАНО: '+dec,'#ffd700');
  }catch(e){
    showOut('Неверный пароль или повреждённый файл!','#f43f5e');
  }
}
</script>
</body>
</html>
